<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ignitia WebSocket Chat</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                color: #333;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                overflow: hidden;
            }
            .header {
                background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
                color: white;
                padding: 20px;
                text-align: center;
            }
            .header h1 {
                margin: 0;
                font-size: 2.5em;
            }
            .main {
                display: flex;
                height: 600px;
            }
            .sidebar {
                width: 300px;
                background: #f8f9fa;
                border-right: 1px solid #dee2e6;
                padding: 20px;
            }
            .chat-area {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            .messages {
                flex: 1;
                padding: 20px;
                overflow-y: auto;
                background: #fff;
            }
            .message {
                margin: 10px 0;
                padding: 10px 15px;
                border-radius: 15px;
                max-width: 70%;
                word-wrap: break-word;
            }
            .message.own {
                background: #007bff;
                color: white;
                margin-left: auto;
                text-align: right;
            }
            .message.other {
                background: #e9ecef;
                margin-right: auto;
            }
            .message.system {
                background: #ffc107;
                color: #212529;
                text-align: center;
                margin: 10px auto;
                font-style: italic;
            }
            .input-area {
                padding: 20px;
                border-top: 1px solid #dee2e6;
                background: #f8f9fa;
            }
            .input-group {
                display: flex;
                gap: 10px;
                margin-bottom: 10px;
            }
            input,
            button,
            select {
                padding: 12px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
            }
            input {
                flex: 1;
            }
            button {
                background: #28a745;
                color: white;
                border: none;
                cursor: pointer;
                transition: background 0.3s;
            }
            button:hover {
                background: #218838;
            }
            button:disabled {
                background: #6c757d;
                cursor: not-allowed;
            }
            .status {
                padding: 10px;
                text-align: center;
                font-weight: bold;
                border-radius: 8px;
                margin-bottom: 15px;
            }
            .connected {
                background: #d4edda;
                color: #155724;
            }
            .disconnected {
                background: #f8d7da;
                color: #721c24;
            }
            .user-list {
                background: white;
                border-radius: 8px;
                padding: 15px;
                margin-bottom: 20px;
            }
            .user-list h3 {
                margin-top: 0;
                color: #495057;
            }
            .user-item {
                padding: 5px 10px;
                background: #e9ecef;
                border-radius: 15px;
                margin: 5px 0;
                font-size: 12px;
            }
            .controls {
                margin-bottom: 20px;
            }
            .controls button {
                width: 100%;
                margin-bottom: 10px;
                background: #6f42c1;
            }
            .controls button:hover {
                background: #5a2d91;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🔥 Ignitia Chat</h1>
                <p>Real-time WebSocket Chat Application</p>
            </div>

            <div class="main">
                <div class="sidebar">
                    <div id="status" class="status disconnected">
                        Disconnected
                    </div>

                    <div class="controls">
                        <button onclick="connect()">Connect</button>
                        <button onclick="disconnect()">Disconnect</button>
                        <button onclick="pingServer()">Ping Server</button>
                        <button onclick="getUserList()">Get Users</button>
                    </div>

                    <div class="input-group">
                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            value="User123"
                        />
                        <input
                            type="text"
                            id="room"
                            placeholder="Room"
                            value="general"
                        />
                        <button onclick="joinRoom()">Join Room</button>
                    </div>

                    <div class="user-list">
                        <h3>👥 Users Online</h3>
                        <div id="userList">No users online</div>
                    </div>
                </div>

                <div class="chat-area">
                    <div id="messages" class="messages"></div>

                    <div class="input-area">
                        <div class="input-group">
                            <input
                                type="text"
                                id="messageInput"
                                placeholder="Type your message..."
                                onkeypress="handleKeyPress(event)"
                            />
                            <button onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            let ws = null;
            let currentUsername = null;
            let currentRoom = null;

            function connect() {
                ws = new WebSocket("ws://localhost:3000/ws");

                ws.onopen = function () {
                    updateStatus("Connected", "connected");
                    addMessage(
                        "Connected to Ignitia WebSocket server",
                        "system",
                    );
                };

                ws.onmessage = function (event) {
                    try {
                        const message = JSON.parse(event.data);
                        handleServerMessage(message);
                    } catch (e) {
                        addMessage("Server: " + event.data, "system");
                    }
                };

                ws.onclose = function () {
                    updateStatus("Disconnected", "disconnected");
                    addMessage("Connection closed", "system");
                    ws = null;
                };

                ws.onerror = function (error) {
                    addMessage("Connection error: " + error, "system");
                };
            }

            function disconnect() {
                if (ws) {
                    ws.close();
                }
            }

            function joinRoom() {
                const username = document.getElementById("username").value;
                const room = document.getElementById("room").value;

                if (!username || !room) {
                    alert("Please enter both username and room");
                    return;
                }

                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    alert("Please connect first");
                    return;
                }

                const joinMessage = {
                    type: "join",
                    username: username,
                    room: room,
                };

                ws.send(JSON.stringify(joinMessage));
                currentUsername = username;
                currentRoom = room;
            }

            function sendMessage() {
                const messageInput = document.getElementById("messageInput");
                const message = messageInput.value.trim();

                if (!message) return;
                if (!currentRoom) {
                    alert("Please join a room first");
                    return;
                }
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    alert("Not connected");
                    return;
                }

                const chatMessage = {
                    type: "message",
                    room: currentRoom,
                    message: message,
                };

                ws.send(JSON.stringify(chatMessage));
                messageInput.value = "";
            }

            function pingServer() {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    alert("Not connected");
                    return;
                }

                const pingMessage = {
                    type: "ping",
                    timestamp: Date.now(),
                };

                ws.send(JSON.stringify(pingMessage));
            }

            function getUserList() {
                if (!currentRoom) {
                    alert("Join a room first");
                    return;
                }

                const getUsersMessage = {
                    type: "get_users",
                    room: currentRoom,
                };

                ws.send(JSON.stringify(getUsersMessage));
            }

            function handleServerMessage(message) {
                switch (message.type) {
                    case "welcome":
                        addMessage(message.message, "system");
                        break;
                    case "joined":
                        addMessage(`Joined room: ${message.room}`, "system");
                        updateUserList(message.users);
                        break;
                    case "chat":
                        const isOwnMessage =
                            message.username === currentUsername;
                        addMessage(
                            `${message.username}: ${message.message}`,
                            isOwnMessage ? "own" : "other",
                        );
                        break;
                    case "notification":
                        addMessage(message.message, "system");
                        break;
                    case "pong":
                        const latency = Date.now() - message.timestamp;
                        addMessage(
                            `Pong received! Latency: ${latency}ms`,
                            "system",
                        );
                        break;
                    case "users":
                        updateUserList(message.users);
                        break;
                    case "error":
                        addMessage(`Error: ${message.message}`, "system");
                        break;
                    default:
                        console.log("Unknown message type:", message);
                }
            }

            function addMessage(text, type = "other") {
                const messages = document.getElementById("messages");
                const div = document.createElement("div");
                div.className = `message ${type}`;
                div.textContent = `${new Date().toLocaleTimeString()} - ${text}`;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            }

            function updateStatus(text, className) {
                const status = document.getElementById("status");
                status.textContent = text;
                status.className = `status ${className}`;
            }

            function updateUserList(users) {
                const userList = document.getElementById("userList");
                if (users.length === 0) {
                    userList.innerHTML = "No users online";
                } else {
                    userList.innerHTML = users
                        .map((user) => `<div class="user-item">${user}</div>`)
                        .join("");
                }
            }

            function handleKeyPress(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            }

            // Auto-connect on page load
            window.onload = function () {
                connect();
            };
        </script>
    </body>
</html>

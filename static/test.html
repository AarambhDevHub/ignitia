<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebSocket Test Page</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background: #f5f5f5;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
                background: white;
                padding: 20px;
                border-radius: 10px;
            }
            .endpoint {
                margin: 20px 0;
                padding: 15px;
                border: 1px solid #ddd;
                border-radius: 8px;
            }
            .controls {
                margin: 10px 0;
            }
            button {
                padding: 8px 16px;
                margin: 5px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .connect {
                background: #28a745;
                color: white;
            }
            .disconnect {
                background: #dc3545;
                color: white;
            }
            .send {
                background: #007bff;
                color: white;
            }
            input {
                padding: 8px;
                margin: 5px;
                width: 300px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
            .messages {
                border: 1px solid #ddd;
                height: 200px;
                overflow-y: scroll;
                padding: 10px;
                margin: 10px 0;
                background: #fafafa;
            }
            .status {
                padding: 10px;
                margin: 10px 0;
                border-radius: 4px;
            }
            .connected {
                background: #d4edda;
                color: #155724;
            }
            .disconnected {
                background: #f8d7da;
                color: #721c24;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🔌 WebSocket Test Page</h1>

            <div class="endpoint">
                <h3>Echo Server (ws://localhost:3000/ws/echo)</h3>
                <div id="echo-status" class="status disconnected">
                    Disconnected
                </div>
                <div class="controls">
                    <button class="connect" onclick="connectEcho()">
                        Connect
                    </button>
                    <button class="disconnect" onclick="disconnectEcho()">
                        Disconnect
                    </button>
                    <input
                        type="text"
                        id="echo-input"
                        placeholder="Message to echo"
                    />
                    <button class="send" onclick="sendEcho()">Send</button>
                </div>
                <div id="echo-messages" class="messages"></div>
            </div>

            <div class="endpoint">
                <h3>Broadcast Server (ws://localhost:3000/ws/broadcast)</h3>
                <div id="broadcast-status" class="status disconnected">
                    Disconnected
                </div>
                <div class="controls">
                    <button class="connect" onclick="connectBroadcast()">
                        Connect
                    </button>
                    <button class="disconnect" onclick="disconnectBroadcast()">
                        Disconnect
                    </button>
                    <input
                        type="text"
                        id="broadcast-input"
                        placeholder="Message to broadcast"
                    />
                    <button class="send" onclick="sendBroadcast()">Send</button>
                </div>
                <div id="broadcast-messages" class="messages"></div>
            </div>

            <div class="endpoint">
                <h3>Performance Test</h3>
                <div class="controls">
                    <button onclick="performanceTest()">
                        Run Performance Test
                    </button>
                    <button onclick="stressTest()">
                        Stress Test (1000 messages)
                    </button>
                    <button onclick="binaryTest()">Binary Data Test</button>
                </div>
                <div id="performance-results" class="messages"></div>
            </div>
        </div>

        <script>
            let echoWs = null;
            let broadcastWs = null;

            // Echo WebSocket functions
            function connectEcho() {
                echoWs = new WebSocket("ws://localhost:3000/ws/echo");

                echoWs.onopen = () => {
                    updateStatus("echo", "Connected", "connected");
                    addMessage("echo", "Connected to echo server");
                };

                echoWs.onmessage = (event) => {
                    addMessage("echo", "Server: " + event.data);
                };

                echoWs.onclose = () => {
                    updateStatus("echo", "Disconnected", "disconnected");
                    addMessage("echo", "Echo connection closed");
                };
            }

            function disconnectEcho() {
                if (echoWs) echoWs.close();
            }

            function sendEcho() {
                const input = document.getElementById("echo-input");
                if (echoWs && echoWs.readyState === WebSocket.OPEN) {
                    echoWs.send(input.value);
                    addMessage("echo", "You: " + input.value);
                    input.value = "";
                }
            }

            // Broadcast WebSocket functions
            function connectBroadcast() {
                broadcastWs = new WebSocket("ws://localhost:3000/ws/broadcast");

                broadcastWs.onopen = () => {
                    updateStatus("broadcast", "Connected", "connected");
                    addMessage("broadcast", "Connected to broadcast server");
                };

                broadcastWs.onmessage = (event) => {
                    addMessage("broadcast", "Broadcast: " + event.data);
                };

                broadcastWs.onclose = () => {
                    updateStatus("broadcast", "Disconnected", "disconnected");
                    addMessage("broadcast", "Broadcast connection closed");
                };
            }

            function disconnectBroadcast() {
                if (broadcastWs) broadcastWs.close();
            }

            function sendBroadcast() {
                const input = document.getElementById("broadcast-input");
                if (broadcastWs && broadcastWs.readyState === WebSocket.OPEN) {
                    broadcastWs.send(input.value);
                    addMessage("broadcast", "You: " + input.value);
                    input.value = "";
                }
            }

            // Performance tests
            async function performanceTest() {
                const results = document.getElementById("performance-results");
                results.innerHTML = "";

                const testWs = new WebSocket("ws://localhost:3000/ws/echo");

                await new Promise((resolve) => {
                    testWs.onopen = resolve;
                });

                const start = performance.now();
                let received = 0;
                const total = 100;

                testWs.onmessage = () => {
                    received++;
                    if (received === total) {
                        const end = performance.now();
                        const duration = end - start;
                        const messagesPerSecond = (
                            (total / duration) *
                            1000
                        ).toFixed(2);

                        results.innerHTML += `<div>Performance Test Results:</div>`;
                        results.innerHTML += `<div>Messages: ${total}</div>`;
                        results.innerHTML += `<div>Duration: ${duration.toFixed(2)}ms</div>`;
                        results.innerHTML += `<div>Messages/second: ${messagesPerSecond}</div>`;

                        testWs.close();
                    }
                };

                for (let i = 0; i < total; i++) {
                    testWs.send(`Message ${i + 1}`);
                }
            }

            async function stressTest() {
                const results = document.getElementById("performance-results");
                results.innerHTML = "Starting stress test...";

                const testWs = new WebSocket("ws://localhost:3000/ws/echo");

                await new Promise((resolve) => {
                    testWs.onopen = resolve;
                });

                const start = performance.now();
                let received = 0;
                const total = 1000;

                testWs.onmessage = () => {
                    received++;
                    if (received % 100 === 0) {
                        results.innerHTML = `Stress test progress: ${received}/${total}`;
                    }
                    if (received === total) {
                        const end = performance.now();
                        const duration = end - start;

                        results.innerHTML += `<div>Stress Test Complete!</div>`;
                        results.innerHTML += `<div>Duration: ${duration.toFixed(2)}ms</div>`;
                        results.innerHTML += `<div>Average: ${(duration / total).toFixed(2)}ms per message</div>`;

                        testWs.close();
                    }
                };

                for (let i = 0; i < total; i++) {
                    testWs.send(`Stress test message ${i + 1}`);
                }
            }

            function binaryTest() {
                const testWs = new WebSocket("ws://localhost:3000/ws/echo");
                const results = document.getElementById("performance-results");

                testWs.onopen = () => {
                    // Send binary data
                    const buffer = new ArrayBuffer(1024);
                    const view = new Uint8Array(buffer);
                    for (let i = 0; i < view.length; i++) {
                        view[i] = i % 256;
                    }

                    testWs.send(buffer);
                    results.innerHTML = "Sent 1KB binary data...";
                };

                testWs.onmessage = (event) => {
                    if (event.data instanceof Blob) {
                        event.data.arrayBuffer().then((buffer) => {
                            results.innerHTML += `<div>Received binary data: ${buffer.byteLength} bytes</div>`;
                            testWs.close();
                        });
                    } else {
                        results.innerHTML += `<div>Received: ${event.data}</div>`;
                        testWs.close();
                    }
                };
            }

            // Helper functions
            function updateStatus(type, text, className) {
                const status = document.getElementById(type + "-status");
                status.textContent = text;
                status.className = `status ${className}`;
            }

            function addMessage(type, message) {
                const messages = document.getElementById(type + "-messages");
                const div = document.createElement("div");
                div.textContent =
                    new Date().toLocaleTimeString() + " - " + message;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            }

            // Auto-connect on page load
            window.onload = function () {
                connectEcho();
                connectBroadcast();
            };
        </script>
    </body>
</html>

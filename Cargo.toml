[package]
name = "ignitia"
version = "0.1.4"
edition = "2021"
description = "A blazing fast, lightweight web framework for Rust that ignitias your development"
authors = ["Aarambh Dev Hub <your@email.com>"]
license = "MIT"
keywords = ["web", "framework", "fast", "ignitia", "http"]
categories = ["web-programming::http-server"]
repository = "https://github.com/AarambhDevHub/ignitia"
homepage = "https://github.com/AarambhDevHub/ignitia"
documentation = "https://docs.rs/ignitia"

[features]
default = []
websocket = ["dep:tokio-tungstenite", "dep:tungstenite", "dep:sha1", "dep:base64", "dep:lazy_static"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tower = "0.5"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = { version = "1.10", features = ["perf"] }
once_cell = "1.19"
futures = "0.3"
pin-project = "1.1"
urlencoding = "2.1"
http = "1.0"
url = "2.5"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1.0" # Add this line

parking_lot = "0.12" # Faster synchronization
arc-swap = "1.6" # For atomic router updates

# WebSocket dependencies (optional)
tokio-tungstenite = { version = "0.21", optional = true }
tungstenite = { version = "0.21", optional = true }
sha1 = { version = "0.10", optional = true }
base64 = { version = "0.21", optional = true }
lazy_static = { version = "1.4", optional = true }

uuid = { version = "1.17.0", features = ["serde", "v4"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"

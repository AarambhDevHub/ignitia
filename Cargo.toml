[package]
name = "ignitia"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
description = "A blazing fast, lightweight web framework for Rust that ignites your development journey"
authors = ["Aarambh Dev Hub <your@email.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/AarambhDevHub/ignitia"
repository = "https://github.com/AarambhDevHub/ignitia"
documentation = "https://docs.rs/ignitia"
keywords = ["web", "framework", "fast", "http", "async"]
categories = ["web-programming::http-server", "asynchronous"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
    "CHANGELOG.md"
]

[features]
default = ["websocket", "tls"]
websocket = ["dep:tokio-tungstenite", "dep:tungstenite", "dep:sha1", "dep:base64", "dep:lazy_static"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]
self-signed = ["tls", "dep:rcgen"]

# Core async runtime and HTTP dependencies
[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full",  "server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tower = "0.5"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = { version = "1.10", features = ["perf"] }
once_cell = "1.19"
futures = "0.3"
pin-project = "1.1"
urlencoding = "2.1"
http = "1.0"
url = "2.5"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1.0" # Add this line

parking_lot = "0.12" # Faster synchronization
arc-swap = "1.6" # For atomic router updates

multer = "3.1"
tempfile = "3.8"
futures-util = "0.3"
mime = "0.3"
async-tempfile = "0.6"

dashmap = "6.0"
mimalloc = "0.1"
num_cpus = "1.17"
smallvec = "1.11"
ahash = "0.8"
memchr = "2.6"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

# WebSocket dependencies (optional)
tokio-tungstenite = { version = "0.23", optional = true }
tungstenite = { version = "0.23", optional = true }
sha1 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
lazy_static = { version = "1.4", optional = true }

uuid = { version = "1.17.0", features = ["serde", "v4"] }
rand = "0.8"

# TLS dependencies (optional)
tokio-rustls = { version = "0.24", optional = true }
rustls = { version = "0.21", optional = true }
rustls-pemfile = { version = "1.0", optional = true }

# For self-signed certificates (development only)
rcgen = { version = "0.11", optional = true, features = ["pem"] }

async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"

# Documentation configuration
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Profile optimizations
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = true
split-debuginfo = "unpacked"
